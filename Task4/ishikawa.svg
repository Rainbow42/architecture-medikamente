<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1000" viewBox="0 0 1820 1000"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243643;font-size:18px}.cat{font-weight:bold;font-size:20px}</style><text x="30" y="40" class="cat">Исикава — риски перехода и роста 5×</text><path d="M30 490H1490" stroke="#3f6a87" stroke-width="3"/><path d="M1490 483L1510 490L1490 497Z" fill="#3f6a87"/><rect x="1510" y="400" width="280" height="185" rx="8" fill="#f6e9df" stroke="#a4704c"/><text x="1650" y="448" text-anchor="middle"><tspan x="1650">Рост 5× не выдержан</tspan><tspan x="1650" dy="30">или данные</tspan><tspan x="1650" dy="30">несогласованы</tspan></text><path d="M80 170L285 490" fill="none" stroke="#56646f" stroke-width="2"/><text x="60" y="125" class="cat">Инфраструктура</text><path d="M40 255H134.453125" stroke="#87939b"/><rect x="42" y="221" width="234" height="24" fill="white"/><text x="45" y="240">Один сервер / общий диск</text><path d="M40 370H208.125" stroke="#87939b"/><rect x="42" y="336" width="158" height="24" fill="white"/><text x="45" y="355">Backup в час пик</text><path d="M430 170L635 490" fill="none" stroke="#56646f" stroke-width="2"/><text x="410" y="125" class="cat">Данные</text><path d="M390 255H484.453125" stroke="#87939b"/><rect x="392" y="221" width="215" height="24" fill="white"/><text x="395" y="240">Дубли / разные форматы</text><path d="M390 370H558.125" stroke="#87939b"/><rect x="392" y="336" width="224.5" height="24" fill="white"/><text x="395" y="355">Потерянные связи сканов</text><path d="M780 170L985 490" fill="none" stroke="#56646f" stroke-width="2"/><text x="760" y="125" class="cat">Интеграции</text><path d="M740 255H834.453125" stroke="#87939b"/><rect x="742" y="221" width="215" height="24" fill="white"/><text x="745" y="240">1С / OLE, сетевые сбои</text><path d="M740 370H908.125" stroke="#87939b"/><rect x="742" y="336" width="158" height="24" fill="white"/><text x="745" y="355">Повторы платежей</text><path d="M1130 170L1335 490" fill="none" stroke="#56646f" stroke-width="2"/><text x="1110" y="125" class="cat">ПО</text><path d="M1090 255H1184.453125" stroke="#87939b"/><rect x="1092" y="221" width="177" height="24" fill="white"/><text x="1095" y="240">Гонки слотов / N+1</text><path d="M1090 370H1258.125" stroke="#87939b"/><rect x="1092" y="336" width="177" height="24" fill="white"/><text x="1095" y="355">OCR блокирует OLTP</text><path d="M80 810L285 490" fill="none" stroke="#56646f" stroke-width="2"/><text x="60" y="865" class="cat">Люди</text><path d="M40 725H134.453125" stroke="#87939b"/><rect x="42" y="691" width="177" height="24" fill="white"/><text x="45" y="710">Три IT-специалиста</text><path d="M40 610H208.125" stroke="#87939b"/><rect x="42" y="576" width="272" height="24" fill="white"/><text x="45" y="595">Ручная сверка / новые навыки</text><path d="M430 810L635 490" fill="none" stroke="#56646f" stroke-width="2"/><text x="410" y="865" class="cat">Процессы</text><path d="M390 725H484.453125" stroke="#87939b"/><rect x="392" y="691" width="139" height="24" fill="white"/><text x="395" y="710">Двойная запись</text><path d="M390 610H558.125" stroke="#87939b"/><rect x="392" y="576" width="234" height="24" fill="white"/><text x="395" y="595">Нет владельца / go-no-go</text><path d="M780 810L985 490" fill="none" stroke="#56646f" stroke-width="2"/><text x="760" y="865" class="cat">Безопасность</text><path d="M740 725H834.453125" stroke="#87939b"/><rect x="742" y="691" width="196" height="24" fill="white"/><text x="745" y="710">Общие права на карты</text><path d="M740 610H908.125" stroke="#87939b"/><rect x="742" y="576" width="205.5" height="24" fill="white"/><text x="745" y="595">Теги после публикации</text><path d="M1130 810L1335 490" fill="none" stroke="#56646f" stroke-width="2"/><text x="1110" y="865" class="cat">Наблюдаемость</text><path d="M1090 725H1184.453125" stroke="#87939b"/><rect x="1092" y="691" width="177" height="24" fill="white"/><text x="1095" y="710">Нет baseline / p95</text><path d="M1090 610H1258.125" stroke="#87939b"/><rect x="1092" y="576" width="186.5" height="24" fill="white"/><text x="1095" y="595">Не проверены алерты</text><text x="30" y="960">Причины — гипотезы по условию. Приоритеты, проверки и меры: bottlenecks.md; измерений реальной клиники нет.</text></svg>
